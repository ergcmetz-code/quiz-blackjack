<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blackjack Quiz - Écran Principal</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0b6623; color: white; text-align: center; margin: 0; padding: 20px; }
        .quiz-container { background: rgba(0,0,0,0.75); padding: 30px; border-radius: 15px; max-width: 850px; margin: auto; box-shadow: 0 0 20px gold; }
        h1 { color: gold; font-size: 2.3em; margin: 5px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .option { padding: 20px; background: #222; border: 3px solid #fff; border-radius: 10px; font-size: 1.4em; }
        .scores { display: flex; justify-content: space-around; margin-top: 30px; background: #111; padding: 15px; border-radius: 10px; border: 1px solid gold;}
        .score-box { font-size: 1.3em; padding: 10px; border-bottom: 4px solid gold; min-width: 150px;}
        .player-name { color: gold; font-weight: bold;}
        .status-alert { font-size: 2.3em; margin-top: 20px; height: 60px; color: #00ffff; font-weight: bold;}
        button.control { background: gold; color: black; font-size: 1.1em; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        
        .admin-panel { background: #222; max-width: 850px; margin: 20px auto; padding: 20px; border-radius: 10px; text-align: left; border: 1px dashed gray;}
        .admin-panel h3 { margin-top: 0; color: gold; }
        .form-group { margin-bottom: 10px; display: flex; }
        .form-group label { width: 150px; }
        .form-group input, .form-group select { flex-grow: 1; padding: 5px; }
        .setup-players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .setup-players input { padding: 8px; font-size: 1em; text-align: center; }
    </style>
</head>
<body>

    <h1>♣ ♦ BLACKJACK QUIZ TABLE ♥ ♠</h1>
    <div style="margin-bottom: 15px; font-size: 1.2em;">Question <span id="q-number">0/0</span></div>
    
    <div class="quiz-container">
        <h2 id="question-text">Chargement...</h2>
        <div class="options">
            <div class="option" id="opt-0">A</div>
            <div class="option" id="opt-1">B</div>
            <div class="option" id="opt-2">C</div>
            <div class="option" id="opt-3">D</div>
        </div>
        
        <div class="status-alert" id="status-text"></div>
        
        <button class="control" onclick="nextQuestion()">Question Suivante (Espace)</button>
        <button style="background:#ff3b30; color:white;" class="control" onclick="resetGame()">Nouvelle Partie</button>
    </div>

    <div class="scores">
        <div class="score-box"><span id="name-1" class="player-name">J1</span>: <span id="score-1">0</span> pts</div>
        <div class="score-box"><span id="name-2" class="player-name">J2</span>: <span id="score-2">0</span> pts</div>
        <div class="score-box"><span id="name-3" class="player-name">J3</span>: <span id="score-3">0</span> pts</div>
        <div class="score-box"><span id="name-4" class="player-name">J4</span>: <span id="score-4">0</span> pts</div>
    </div>

    <div class="admin-panel">
        <h3>👤 Noms des Joueurs (Modifier ici)</h3>
        <div class="setup-players">
            <input type="text" id="input-name-1" placeholder="Nom Joueur 1" value="Joueur 1">
            <input type="text" id="input-name-2" placeholder="Nom Joueur 2" value="Joueur 2">
            <input type="text" id="input-name-3" placeholder="Nom Joueur 3" value="Joueur 3">
            <input type="text" id="input-name-4" placeholder="Nom Joueur 4" value="Joueur 4">
        </div>
        <button onclick="updateAllNames()" style="background: gold; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">Enregistrer et Envoyer les prénoms sur l'iPad</button>
    </div>

    <div class="admin-panel">
        <h3>➕ Ajouter une question à la base de données</h3>
        <div class="form-group">
            <label>Question :</label>
            <input type="text" id="new-q" placeholder="Ex: Quelle est la capitale de la France ?">
        </div>
        <div class="form-group">
            <label>Réponse A :</label>
            <input type="text" id="new-a">
        </div>
        <div class="form-group">
            <label>Réponse B :</label>
            <input type="text" id="new-b">
        </div>
        <div class="form-group">
            <label>Réponse C :</label>
            <input type="text" id="new-c">
        </div>
        <div class="form-group">
            <label>Réponse D :</label>
            <input type="text" id="new-d">
        </div>
        <div class="form-group">
            <label>Bonne réponse :</label>
            <select id="new-correct">
                <option value="0">Réponse A</option>
                <option value="1">Réponse B</option>
                <option value="2">Réponse C</option>
                <option value="3">Réponse D</option>
            </select>
        </div>
        <button onclick="submitQuestion()" style="background: #34c759; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Enregistrer la question</button>
    </div>

    <script>
        let initialLoad = true;

        function updateScreen() {
            fetch('/api/state')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('q-number').innerText = (data.current_idx + 1) + "/" + data.total_questions;
                    document.getElementById('question-text').innerText = data.question;
                    document.getElementById('opt-0').innerText = "A: " + data.options[0];
                    document.getElementById('opt-1').innerText = "B: " + data.options[1];
                    document.getElementById('opt-2').innerText = "C: " + data.options[2];
                    document.getElementById('opt-3').innerText = "D: " + data.options[3];

                    for(let i=1; i<=4; i++) {
                        document.getElementById(`score-${i}`).innerText = data.scores[i];
                        document.getElementById(`name-${i}`).innerText = data.names[i];
                        
                        // Remplir les inputs seulement au tout premier chargement
                        if (initialLoad) {
                            document.getElementById(`input-name-${i}`).value = data.names[i];
                        }
                    }
                    initialLoad = false;

                    if(data.status === "answered") {
                        let pName = data.names[data.buzzed_player];
                        let letter = ["A", "B", "C", "D"][data.selected_answer];
                        document.getElementById('status-text').innerText = `${pName} a choisi la réponse [ ${letter} ] !`;
                    } else {
                        document.getElementById('status-text').innerText = "À vos buzzers !";
                    }
                });
        }

        function updateAllNames() {
            for(let i=1; i<=4; i++) {
                let nameValue = document.getElementById(`input-name-${i}`).value;
                fetch('/api/set_name', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ player: i, name: nameValue })
                });
            }
        }

        function nextQuestion() {
            fetch('/api/next', {method: 'POST'}).then(() => updateScreen());
        }

        function resetGame() {
            if(confirm("Lancer une nouvelle partie ? (Reset des scores et noms)")) {
                fetch('/api/reset_game', {method: 'POST'}).then(() => {
                    initialLoad = true;
                    updateScreen();
                });
            }
        }

        function submitQuestion() {
            const payload = {
                question: document.getElementById('new-q').value,
                opt0: document.getElementById('new-a').value,
                opt1: document.getElementById('new-b').value,
                opt2: document.getElementById('new-c').value,
                opt3: document.getElementById('new-d').value,
                correct: document.getElementById('new-correct').value
            };

            if(!payload.question || !payload.opt0 || !payload.opt1) {
                alert("Veuillez remplir au moins la question et les options A et B !");
                return;
            }

            fetch('/api/add_question', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Question ajoutée !");
                document.getElementById('new-q').value = "";
                document.getElementById('new-a').value = "";
                document.getElementById('new-b').value = "";
                document.getElementById('new-c').value = "";
                document.getElementById('new-d').value = "";
                updateScreen();
            });
        }

        window.addEventListener('keydown', (e) => { if(e.code === "Space") nextQuestion(); });
        setInterval(updateScreen, 400);
        updateScreen();
    </script>
</body>
</html>
